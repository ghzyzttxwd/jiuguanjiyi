name: VAB Production v0.8 Tests

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap.js'
      - 'unified_runtime.js'
      - 'mvu_recovery.js'
      - 'hot_archive_reconcile.js'
      - 'hot_archive_reconcile_core.js'
      - 'hot_state_governor.js'
      - 'hot_state_governor_core.js'
      - 'hot_state_preview_core.js'
      - 'warm_catalog.js'
      - 'warm_catalog_core.js'
      - 'safe_cooling_executor.js'
      - 'safe_cooling_core.js'
      - 'history_compaction_executor.js'
      - 'history_compaction_core.js'
      - 'auto_cooling_scheduler.js'
      - 'auto_cooling_scheduler_core.js'
      - 'macro_mux.js'
      - 'macro_mux_core.js'
      - 'self_update.js'
      - 'self_update_core.js'
      - 'ui_version_surface.js'
      - 'manifest.json'
      - 'experimental/**'
      - '.github/workflows/production-v020-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Treat JS as ES modules
        run: printf '{"type":"module"}\n' > package.json

      - name: Syntax
        run: |
          node --check bootstrap.js
          node --check unified_runtime.js
          node --check mvu_recovery.js
          node --check hot_archive_reconcile.js
          node --check hot_archive_reconcile_core.js
          node --check hot_state_governor.js
          node --check hot_state_governor_core.js
          node --check hot_state_preview_core.js
          node --check warm_catalog.js
          node --check warm_catalog_core.js
          node --check safe_cooling_executor.js
          node --check safe_cooling_core.js
          node --check history_compaction_executor.js
          node --check history_compaction_core.js
          node --check auto_cooling_scheduler.js
          node --check auto_cooling_scheduler_core.js
          node --check macro_mux.js
          node --check macro_mux_core.js
          node --check self_update.js
          node --check self_update_core.js
          node --check ui_version_surface.js
          node --check experimental/boot_guard_core.js
          node --check experimental/recall_safe.js
          node --check experimental/rehydration_transaction.js
          node --check experimental/one_time_archive_test_core.js
          node --check experimental/one_time_archive_test.js

      - name: Hot archive reconcile behavior
        run: |
          node --input-type=module <<'JS'
          import { selectHotArchiveMatches } from './hot_archive_reconcile_core.js';
          const scopeKey = 'card_x:chat_y';
          const archived = { id:'arc_1', scopeKey, status:'archived', pointer:'/人物/佟佳氏', childKey:'佟佳氏', sourcePath:'/人物' };
          const unrelated = { id:'arc_2', scopeKey, status:'archived', pointer:'/人物/毛东珠', childKey:'毛东珠', sourcePath:'/人物' };
          const hot = { 人物: { 佟佳氏: { 好感: 80 } } };
          const matches = selectHotArchiveMatches({ archives:[archived, unrelated], statData:hot, scopeKey });
          if (matches.length !== 1 || matches[0].pointer !== '/人物/佟佳氏') throw new Error('hot reconcile failed');
          if (selectHotArchiveMatches({ archives:[archived], statData:{人物:{}}, scopeKey }).length) throw new Error('cold-only record must not be closed');
          console.log('hot archive reconcile behavior ok');
          JS

      - name: Universal governor and cooling preview behavior
        run: |
          node --input-type=module <<'JS'
          import { analyzeHotState, detectMainGod } from './hot_state_governor_core.js';
          import { buildCoolingPreview } from './hot_state_preview_core.js';

          const youngCard = { 玩家:{ 武学:{ 凝血神剑:{境界:'小成'}, 凌波微步:{境界:'入门'} }, 姓名:'甲' }, 世界:{ 已改变事件:{}, 重大情报:{} } };
          const youngReport = analyzeHotState(youngCard);
          const martial = youngReport.collections.find(x => x.path === '/玩家/武学');
          if (!martial || martial.count !== 2 || martial.level !== 'ok') throw new Error('small semantic collection discovery failed');
          if (youngReport.collections.some(x => x.path === '/玩家')) throw new Error('fixed parent object misclassified');
          const youngPreview = buildCoolingPreview(youngCard, youngReport, { recentText:'凝血神剑', messageCount:2 });
          if (youngPreview.summary.totalCandidateCount !== 0) throw new Error('small collection must not cool');

          const many = {};
          const touches = { '/玩家/武学': {} };
          for (let i=0;i<15;i++) {
            many[`武学${i}`] = { 境界:'入门' };
            touches['/玩家/武学'][`武学${i}`] = { lastChanged: 10 };
          }
          many['当前主修'] = { 是否主修:true, 境界:'大成' };
          touches['/玩家/武学']['当前主修'] = { lastChanged: 49 };
          const largeCard = { 玩家:{ 武学:many } };
          const largeReport = analyzeHotState(largeCard);
          const preview = buildCoolingPreview(largeCard, largeReport, { recentText:'武学14 当前主修', messageCount:50, touchMap:touches });
          const plan = preview.collections.find(x => x.path === '/玩家/武学');
          if (!plan || plan.cooling.length !== 4) throw new Error(`expected 4 cooling candidates, got ${plan?.cooling.length}`);
          if (plan.cooling.some(x => x.key === '当前主修')) throw new Error('protected current/main item must stay hot');
          if (!plan.cooling.every(x => x.ageMessages === 40)) throw new Error('idle age must flow into cooling preview');
          if (!preview.warmIndex.length || preview.summary.estimatedCoolingBytes <= 0) throw new Error('warm-index preview missing');

          const mainGod = { 玩家:{能力:{},装备:{}}, 轮回残印:{}, 当前轮回:{}, 当前世界:{}, 长期人物:{}, 世界档案:{} };
          if (!detectMainGod(mainGod)) throw new Error('main-god adapter not detected');
          console.log('universal governor and cooling preview ok');
          JS

      - name: Internal history compaction behavior
        run: |
          node --input-type=module <<'JS'
          import {
            selectHistoryCompactionPlan,
            validateHistoryPlanCurrent,
            validateHistoryPost,
            evaluateAutoHistoryCompaction,
          } from './history_compaction_core.js';

          const items = Array.from({length:17}, (_,i) => ({事件:`经历${i+1}`}));
          const statData = { 长期人物:{ 小龙女:{ 共同经历:items } } };
          const baseRow = {
            containerPath:'/长期人物', ownerKey:'小龙女', fieldPath:'/共同经历', label:'共同经历',
            count:17, softLimit:8, keep:8, hardLimit:16, level:'hard', inferred:false,
          };
          let candidate = selectHistoryCompactionPlan({ preview:{histories:[baseRow]}, statData });
          if (!candidate || candidate.removeCount !== 6 || candidate.afterCount !== 11) throw new Error('history segment selection failed');
          if (candidate.removedItems[0].事件 !== '经历1' || candidate.expectedRemaining[0].事件 !== '经历7') throw new Error('must remove oldest prefix only');
          if (!validateHistoryPlanCurrent(candidate, statData).ok) throw new Error('pre validation failed');
          const after = { 长期人物:{ 小龙女:{ 共同经历:items.slice(6) } } };
          if (!validateHistoryPost(candidate, after).ok) throw new Error('post validation failed');

          const inferred = {...baseRow, inferred:true};
          if (selectHistoryCompactionPlan({ preview:{histories:[inferred]}, statData, appendEvidence:{'/长期人物/小龙女/共同经历':1} })) throw new Error('generic inferred history must wait for append-order evidence');
          candidate = selectHistoryCompactionPlan({ preview:{histories:[inferred]}, statData, appendEvidence:{'/长期人物/小龙女/共同经历':2} });
          if (!candidate) throw new Error('learned append-end generic history should become eligible');

          let d = evaluateAutoHistoryCompaction({enabled:true,generationActive:false,messageCount:30,armedMessageCount:29,plan:{status:'ready',candidate}});
          if (!d.allow) throw new Error(d.reason);
          d = evaluateAutoHistoryCompaction({enabled:true,generationActive:false,messageCount:30,armedMessageCount:30,plan:{status:'ready',candidate}});
          if (d.allow) throw new Error('history compaction must wait for new stable message after arming');
          d = evaluateAutoHistoryCompaction({enabled:true,generationActive:true,messageCount:30,armedMessageCount:20,plan:{status:'ready',candidate}});
          if (d.allow) throw new Error('generation must block history compaction');
          console.log('internal history compaction behavior ok');
          JS

      - name: Warm catalog merge behavior
        run: |
          node --input-type=module <<'JS'
          import { buildCatalogEntries, buildDirectoryContext } from './warm_catalog_core.js';
          const statData = { 玩家:{ 武学:{ 凝血神剑:{境界:'小成'}, 凌波微步:{境界:'入门'} } } };
          const report = { collections:[{ path:'/玩家/武学', label:'武学' }] };
          const preview = { collections:[{ path:'/玩家/武学', cooling:[] }] };
          const archives = [
            { id:'arc_1', status:'archived', sourcePath:'/玩家/武学', childKey:'紫霞神功', summary:'紫霞神功｜境界:大成', size:333 },
            { id:'arc_old', status:'archived', sourcePath:'/玩家/武学', childKey:'凝血神剑', summary:'旧凝血神剑', size:999 },
            { id:'hist_1', status:'archived', recordType:'history-segment', sourcePath:'/长期人物/小龙女/共同经历', childKey:'小龙女·共同经历', summary:'旧经历', size:500 },
          ];
          const entries = buildCatalogEntries({ statData, report, preview, archives, scopeKey:'scope1', scopeLabel:'测试' });
          if (entries.length !== 3) throw new Error(`expected 3 entity catalog entries, got ${entries.length}`);
          if (entries.find(x => x.childKey === '小龙女·共同经历')) throw new Error('history segment must not pollute entity directory');
          if (entries.find(x => x.childKey === '凝血神剑')?.temperature !== 'hot') throw new Error('hot MVU must override stale cold archive');
          if (entries.find(x => x.childKey === '紫霞神功')?.temperature !== 'cold') throw new Error('cold archive missing');
          const ctx = buildDirectoryContext(entries, '我会哪些武学？');
          if (!ctx.includes('凝血神剑') || !ctx.includes('紫霞神功[冷]')) throw new Error('directory context incomplete');
          console.log('warm catalog behavior ok');
          JS

      - name: Safe cooling behavior
        run: |
          node --input-type=module <<'JS'
          import { selectNextCoolingCandidate, validatePreCooling, validatePostCooling } from './safe_cooling_core.js';
          const preview = { collections:[{ path:'/玩家/武学', label:'武学', count:16, softLimit:12, hardLimit:24, cooling:[
            {key:'旧剑法',score:2,bytes:900,reasons:[],ageMessages:40},
            {key:'旧掌法',score:5,bytes:500,reasons:[],ageMessages:30}
          ]}] };
          const chosen = selectNextCoolingCandidate(preview);
          if (!chosen || chosen.pointer !== '/玩家/武学/旧剑法' || chosen.ageMessages !== 40) throw new Error('safe cooling candidate selection failed');
          const pre = validatePreCooling({ candidate:chosen, statData:{玩家:{武学:{旧剑法:{}}}}, scopeKey:'s', catalogEntries:[{scopeKey:'s',pointer:chosen.pointer,temperature:'hot',coolingCandidate:true}] });
          if (!pre.ok) throw new Error(pre.reason);
          const post = validatePostCooling({ candidate:chosen, statData:{玩家:{武学:{}}}, scopeKey:'s', catalogEntries:[{scopeKey:'s',pointer:chosen.pointer,temperature:'cold',archiveId:'arc_1'}] });
          if (!post.ok) throw new Error(post.reason);
          console.log('safe cooling behavior ok');
          JS

      - name: Automatic scheduler policy behavior
        run: |
          node --input-type=module <<'JS'
          import { evaluateAutoCooling } from './auto_cooling_scheduler_core.js';
          const base = { status:'ready', candidate:{ pointer:'/玩家/武学/旧剑法', heatScore:1, ageMessages:40, reasons:[], hardExceeded:0 } };
          let d = evaluateAutoCooling({ enabled:true, generationActive:false, messageCount:50, armedMessageCount:49, plan:base });
          if (!d.allow) throw new Error(`stable old candidate should auto cool: ${d.reason}`);
          d = evaluateAutoCooling({ enabled:true, generationActive:false, messageCount:50, armedMessageCount:50, plan:base });
          if (d.allow) throw new Error('must wait for a new stable message after arming');
          d = evaluateAutoCooling({ enabled:true, generationActive:false, messageCount:50, armedMessageCount:40, plan:{...base,candidate:{...base.candidate,ageMessages:4}} });
          if (d.allow) throw new Error('recent candidate must not auto cool');
          d = evaluateAutoCooling({ enabled:true, generationActive:false, messageCount:50, armedMessageCount:40, plan:{...base,candidate:{...base.candidate,reasons:['最近对话直接提及']}} });
          if (d.allow) throw new Error('mentioned candidate must not auto cool');
          d = evaluateAutoCooling({ enabled:true, generationActive:true, messageCount:50, armedMessageCount:40, plan:base });
          if (d.allow) throw new Error('generation must block auto cooling');
          console.log('automatic scheduler policy ok');
          JS

      - name: Production safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "import './auto_cooling_scheduler.js'" bootstrap.js
          grep -q "import './unified_runtime.js'" bootstrap.js
          ! grep -q "import './production_auto.js'" bootstrap.js
          grep -q "import './safe_cooling_executor.js'" bootstrap.js
          grep -q "import './history_compaction_executor.js'" bootstrap.js
          grep -q "import './warm_catalog.js'" bootstrap.js
          grep -q '"version": "0.8.0"' manifest.json
          grep -q '"auto_update": true' manifest.json
          grep -q "const VERSION = '0.8.0'" auto_cooling_scheduler.js
          grep -q "const VERSION = '0.8.0'" history_compaction_executor.js
          grep -q "minMessagesBeforeAuto: 20" auto_cooling_scheduler_core.js
          grep -q "minMessagesBeforeAuto: 20" history_compaction_core.js
          grep -q "requiredAppendEvidenceForInferred: 2" history_compaction_core.js
          grep -q "maxTransactionsPerCycle: 1" auto_cooling_scheduler.js
          grep -q "armedMessageCount = messageCount()" auto_cooling_scheduler.js
          grep -q "historyExecutor" auto_cooling_scheduler.js
          grep -q "saveSnapshot?.('before-auto-history-compact')" history_compaction_executor.js
          grep -q "status: 'pending'" history_compaction_executor.js
          grep -q "rollbackTargetArray" history_compaction_executor.js
          grep -q "recordType: 'history-segment'" history_compaction_executor.js
          ! grep -q "\.archiveChild" auto_cooling_scheduler.js history_compaction_executor.js
          ! grep -q "replaceMvuData" auto_cooling_scheduler.js auto_cooling_scheduler_core.js history_compaction_core.js unified_runtime.js
          grep -q "import('./experimental/recall_safe.js')" unified_runtime.js
          ! grep -q "auto_lifecycle_safe.js" unified_runtime.js
          grep -q "START_DELAY_MS = 4500" unified_runtime.js
          grep -q "HEALTH_WATCHDOG_MS = 15000" unified_runtime.js
          grep -q "status: 'restored'" hot_archive_reconcile.js
          grep -q "hotAuthoritative: true" hot_archive_reconcile.js
          grep -q "recordType: 'warm-catalog'" warm_catalog_core.js
          grep -q "recordType === 'history-segment'" warm_catalog_core.js
          grep -q "automaticEnabled: false" safe_cooling_executor.js
          grep -q "maxItemsPerRun: 1" safe_cooling_executor.js
          grep -q "const CURRENT_VERSION = '0.8.0'" self_update.js
          grep -q "const FALLBACK_VERSION = '0.8.0'" ui_version_surface.js
          ! grep -q "new MutationObserver" bootstrap.js unified_runtime.js mvu_recovery.js hot_archive_reconcile.js hot_state_governor.js warm_catalog.js safe_cooling_executor.js history_compaction_executor.js auto_cooling_scheduler.js self_update.js ui_version_surface.js
          ! grep -q "'/api/extensions/delete'\|'/api/extensions/install'" self_update.js

      - name: Import graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sys
          roots=[pathlib.Path('bootstrap.js')]
          seen=set(); missing=[]
          while roots:
              p=roots.pop()
              if p in seen or not p.exists(): continue
              seen.add(p)
              text=p.read_text(encoding='utf-8')
              for rel in re.findall(r"(?:from\s+|import\s*\()['\"](\./[^'\"]+)['\"]", text):
                  q=(p.parent/rel).resolve()
                  try: rq=q.relative_to(pathlib.Path.cwd().resolve())
                  except Exception: continue
                  if q.suffix=='' and not q.exists() and q.with_suffix('.js').exists(): q=q.with_suffix('.js'); rq=q.relative_to(pathlib.Path.cwd().resolve())
                  if not q.exists(): missing.append(f'{p} -> {rel}')
                  elif q.suffix=='.js': roots.append(rq)
          if missing: print('\n'.join(missing)); sys.exit(1)
          print(f'import graph ok: {len(seen)} files')
          PY
