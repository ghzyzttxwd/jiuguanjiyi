name: VAB Production v0.2 Tests

on:
  push:
    branches: [main]
    paths:
      - 'production_auto.js'
      - 'bootstrap.js'
      - 'manifest.json'
      - 'experimental/**'
      - '.github/workflows/production-v020-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Treat JS as ES modules
        run: printf '{"type":"module"}\n' > package.json
      - name: Syntax
        run: |
          node --check bootstrap.js
          node --check production_auto.js
          node --check experimental/boot_guard_core.js
          node --check experimental/recall_safe.js
          node --check experimental/auto_lifecycle_safe.js
          node --check experimental/rehydration_transaction.js
          node --check experimental/one_time_archive_test_core.js
          node --check experimental/one_time_archive_test.js
      - name: One-time archive selector behavior
        run: |
          node --input-type=module <<'JS'
          import { selectOneTimeArchiveTestCandidate } from './experimental/one_time_archive_test_core.js';
          const statData = {
            人物: {
              当前主角: { note: 'protected' },
              甲人物: { bio: 'a'.repeat(500) },
              乙人物: { bio: 'b'.repeat(80) },
              丙人物: { bio: 'c'.repeat(120) },
              丁人物: { bio: 'd'.repeat(140) },
              VAB测试节点: { bio: 'tiny' },
            },
            当前队伍: { 成员: ['甲人物'] },
          };
          const picked = selectOneTimeArchiveTestCandidate({ statData, recentText: '刚刚遇到乙人物' });
          if (!picked) throw new Error('expected a candidate');
          if (picked.key !== 'VAB测试节点') throw new Error(`expected preferred test node, got ${picked.key}`);
          const withoutTest = structuredClone(statData);
          delete withoutTest.人物.VAB测试节点;
          const picked2 = selectOneTimeArchiveTestCandidate({ statData: withoutTest, recentText: '刚刚遇到乙人物' });
          if (!picked2) throw new Error('expected fallback candidate');
          if (picked2.key === '乙人物' || picked2.key === '当前主角' || picked2.key === '甲人物') {
            throw new Error(`protection failed: ${picked2.key}`);
          }
          console.log('one-time archive selector ok', picked.key, picked2.key);
          JS
      - name: Production safety invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "import './production_auto.js'" bootstrap.js
          grep -q '"version": "0.2.0"' manifest.json
          grep -q '"auto_update": false' manifest.json
          grep -q "START_DELAY_MS = 4500" production_auto.js
          grep -q "decideAutoStart" production_auto.js
          grep -q "beginBoot" production_auto.js
          grep -q "markBootHealthy" production_auto.js
          grep -q "markBootFailed" production_auto.js
          grep -q "setRecallEnabledSession(true)" production_auto.js
          grep -q "setLifecycleEnabledSession(true, { skipConfirm: true })" production_auto.js
          grep -q "HEALTH_WATCHDOG_MS = 15000" production_auto.js
          grep -q "fail-closed" production_auto.js
          grep -q "runOneTimeArchiveTest" production_auto.js
          grep -q "archiveChild(candidate.containerPath, candidate.key, { automatic: true })" experimental/one_time_archive_test.js
          grep -q "snapshotVerified" experimental/one_time_archive_test.js
          grep -q "archiveVerified" experimental/one_time_archive_test.js
          ! grep -q "new MutationObserver" production_auto.js bootstrap.js experimental/one_time_archive_test.js experimental/one_time_archive_test_core.js
          ! grep -q "restoreArchive" production_auto.js experimental/one_time_archive_test.js
          grep -q "autoConservative: true" experimental/auto_lifecycle_safe.js
      - name: Import graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sys
          roots = [pathlib.Path('bootstrap.js'), pathlib.Path('production_auto.js')]
          seen=set(); missing=[]
          while roots:
              p=roots.pop()
              if p in seen or not p.exists():
                  continue
              seen.add(p)
              text=p.read_text(encoding='utf-8')
              for rel in re.findall(r"(?:from\s+|import\s*\()['\"](\./[^'\"]+)['\"]", text):
                  q=(p.parent/rel).resolve()
                  try: rq=q.relative_to(pathlib.Path.cwd().resolve())
                  except Exception: continue
                  if q.suffix=='' and not q.exists() and q.with_suffix('.js').exists():
                      q=q.with_suffix('.js'); rq=q.relative_to(pathlib.Path.cwd().resolve())
                  if not q.exists(): missing.append(f'{p} -> {rel}')
                  elif q.suffix=='.js': roots.append(rq)
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print(f'import graph ok: {len(seen)} files')
          PY
