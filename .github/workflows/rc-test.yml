name: Variable Archive Bridge RC Tests

on:
  push:
    paths:
      - 'experimental/**'
      - 'safe_loader.js'
      - 'smart_scan.js'
      - 'bootstrap.js'
      - '.github/workflows/rc-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Treat JS as ES modules for tests
        run: printf '{"type":"module"}\n' > package.json
      - name: Smart host core tests
        run: node experimental/test_smart_host_core.mjs
      - name: Cold recall core tests
        run: node experimental/test_recall_core.mjs
      - name: Recall delivery conflict tests
        run: node experimental/test_recall_delivery_core.mjs
      - name: Rehydration planning tests
        run: node experimental/test_rehydration_core.mjs
      - name: Rehydration transaction tests
        run: node experimental/test_rehydration_transaction.mjs
      - name: Live rehydration adapter contract tests
        run: node experimental/test_rehydration_live_adapter.mjs
      - name: Unified lifecycle decision tests
        run: node experimental/test_auto_lifecycle_core.mjs
      - name: Unified memory master tests
        run: node experimental/test_memory_master_core.mjs
      - name: End-to-end cold memory lifecycle
        run: node experimental/test_memory_pipeline_e2e.mjs
      - name: Long-session stress simulation
        run: node experimental/test_smart_host_stress.mjs
      - name: Syntax checks
        run: |
          node --check experimental/smart_host_core.js
          node --check experimental/smart_host_safe.js
          node --check experimental/recall_core.js
          node --check experimental/recall_delivery_core.js
          node --check experimental/recall_safe.js
          node --check experimental/rehydration_core.js
          node --check experimental/rehydration_transaction.js
          node --check experimental/rehydration_safe.js
          node --check experimental/rehydration_live_adapter.js
          node --check experimental/rehydration_live_safe.js
          node --check experimental/auto_lifecycle_core.js
          node --check experimental/auto_lifecycle_safe.js
          node --check experimental/memory_master_core.js
          node --check experimental/memory_master_safe.js
          node --check experimental/test_smart_host_stress.mjs
          node --check experimental/test_recall_core.mjs
          node --check experimental/test_recall_delivery_core.mjs
          node --check experimental/test_rehydration_core.mjs
          node --check experimental/test_rehydration_transaction.mjs
          node --check experimental/test_rehydration_live_adapter.mjs
          node --check experimental/test_auto_lifecycle_core.mjs
          node --check experimental/test_memory_master_core.mjs
          node --check experimental/test_memory_pipeline_e2e.mjs
          node --check safe_loader.js
          node --check smart_scan.js
          node --check bootstrap.js
      - name: Safety invariants
        shell: bash
        run: |
          if grep -R "new MutationObserver" bootstrap.js smart_scan.js safe_loader.js experimental/smart_host_safe.js experimental/recall_safe.js experimental/rehydration_safe.js experimental/rehydration_live_safe.js experimental/auto_lifecycle_safe.js experimental/memory_master_safe.js; then
            echo 'Forbidden MutationObserver found in active or candidate UI code.'
            exit 1
          fi
          grep -q "enabled = false" experimental/smart_host_safe.js
          grep -q "if (!cfg.enabled)" experimental/smart_host_safe.js
          grep -q "generationActive" experimental/smart_host_safe.js
          grep -q "removeListener" experimental/smart_host_safe.js
          grep -q "MAX_ERRORS_IN_WINDOW" experimental/smart_host_safe.js
          if grep -q "CYCLE_INTERVAL_MS" experimental/smart_host_safe.js; then
            echo 'Periodic archive cycle reintroduced; smart host must remain event-driven.'
            exit 1
          fi
          if grep -Eq "setInterval\([^\n]*runCycle" experimental/smart_host_safe.js; then
            echo 'Periodic runCycle polling detected; forbidden in candidate.'
            exit 1
          fi

          # Recall layer must be isolated, default-off, coordinate duplicate channels, clear only its own prompt, and never write MVU.
          grep -q "let enabled = false" experimental/recall_safe.js
          grep -q "PROMPT_KEY = 'vab_cold_recall'" experimental/recall_safe.js
          grep -q "detectMacroPlacement" experimental/recall_safe.js
          grep -q "detectPromptKeyCollision" experimental/recall_safe.js
          grep -q "analyzeRecallDelivery" experimental/recall_safe.js
          grep -q "setExtensionPrompt" experimental/recall_safe.js
          grep -q "removeListener" experimental/recall_safe.js
          grep -q "clearInjection" experimental/recall_safe.js
          grep -q "legacy-macro" experimental/recall_delivery_core.js
          grep -q "blocked-collision" experimental/recall_delivery_core.js
          ! grep -q "replaceMvuData" experimental/recall_safe.js
          ! grep -q "archiveChild" experimental/recall_safe.js
          ! grep -q "restoreArchive" experimental/recall_safe.js

          # Read-only rehydration core/UI stay read-only; transaction engine itself is dependency-injected.
          grep -q "merge-hot-over-cold" experimental/rehydration_core.js
          grep -q "只读" experimental/rehydration_safe.js
          grep -q "rollbackSafely" experimental/rehydration_transaction.js
          grep -q "scope-changed" experimental/rehydration_transaction.js
          grep -q "verify-failed" experimental/rehydration_transaction.js
          ! grep -q "replaceMvuData" experimental/rehydration_core.js
          ! grep -q "indexedDB" experimental/rehydration_core.js
          ! grep -q "replaceMvuData" experimental/rehydration_safe.js
          ! grep -q "archiveChild" experimental/rehydration_safe.js
          ! grep -q "restoreArchive" experimental/rehydration_safe.js
          ! grep -q "indexedDB" experimental/rehydration_safe.js
          ! grep -q "replaceMvuData" experimental/rehydration_transaction.js
          ! grep -q "indexedDB" experimental/rehydration_transaction.js
          ! grep -q "window.Mvu" experimental/rehydration_transaction.js

          # Live rehydration writer is isolated behind two manual gates and never arms persistently.
          grep -q "let armed = false" experimental/rehydration_live_safe.js
          grep -q "executeOne" experimental/rehydration_live_safe.js
          grep -q "confirm" experimental/rehydration_live_safe.js
          grep -q "isGenerationActive" experimental/rehydration_live_safe.js
          grep -q "armed = false" experimental/rehydration_live_safe.js
          ! grep -q "replaceMvuData" experimental/rehydration_live_safe.js
          ! grep -q "indexedDB" experimental/rehydration_live_safe.js
          grep -q "replaceMvuData" experimental/rehydration_live_adapter.js
          grep -q "indexedDB" experimental/rehydration_live_adapter.js
          grep -q "scope已变化" experimental/rehydration_live_adapter.js
          grep -q "正在生成消息" experimental/rehydration_live_adapter.js
          grep -q "竞态" experimental/rehydration_live_adapter.js
          grep -q "Dependency injection exists for CI contract tests" experimental/rehydration_live_adapter.js

          # Unified lifecycle candidate: session-only, event-driven, never hard-restores a cold record on mention.
          grep -q "let enabled = false" experimental/auto_lifecycle_safe.js
          grep -q "updateRehydrationObservations" experimental/auto_lifecycle_safe.js
          grep -q "executeRehydrationTransaction" experimental/auto_lifecycle_safe.js
          grep -q "archiveChild" experimental/auto_lifecycle_safe.js
          grep -q "MAX_ERRORS_IN_WINDOW" experimental/auto_lifecycle_safe.js
          grep -q "mention-only-restore" experimental/auto_lifecycle_core.js
          grep -q "Prompt召回" experimental/auto_lifecycle_core.js
          ! grep -q "restoreArchive" experimental/auto_lifecycle_safe.js
          ! grep -q "setInterval([^\n]*runCycle" experimental/auto_lifecycle_safe.js
          ! grep -q "localStorage.setItem.*enabled" experimental/auto_lifecycle_safe.js

          # Unified memory master: one session-only switch, recall first / writer second, rollback on partial enable, fail-closed on child failure.
          grep -q "let masterEnabled = false" experimental/memory_master_safe.js
          grep -q "enableMasterStack" experimental/memory_master_safe.js
          grep -q "disableMasterStack" experimental/memory_master_safe.js
          grep -q "assessMasterHealth" experimental/memory_master_safe.js
          grep -q "fail-closed" experimental/memory_master_safe.js
          grep -q "Prompt召回" experimental/memory_master_core.js
          grep -q "lifecycle" experimental/memory_master_core.js
          ! grep -q "localStorage.setItem.*masterEnabled" experimental/memory_master_safe.js
          ! grep -q "replaceMvuData" experimental/memory_master_safe.js
          ! grep -q "archiveChild" experimental/memory_master_safe.js
          ! grep -q "restoreArchive" experimental/memory_master_safe.js
          ! grep -q "indexedDB" experimental/memory_master_safe.js

          # Production startup remains inert. Candidate code may only be dynamically imported by the explicit safety gate.
          grep -q "import('./experimental/smart_host_safe.js')" safe_loader.js
          grep -q "import('./experimental/recall_safe.js')" safe_loader.js
          grep -q "import('./experimental/rehydration_safe.js')" safe_loader.js
          grep -q "import('./experimental/rehydration_live_safe.js')" safe_loader.js
          grep -q "import('./experimental/auto_lifecycle_safe.js')" safe_loader.js
          grep -q "import('./experimental/memory_master_safe.js')" safe_loader.js
          ! grep -q "import './experimental/smart_host_safe.js'" bootstrap.js
          ! grep -q "recall_safe" bootstrap.js
          ! grep -q "rehydration_safe" bootstrap.js
          ! grep -q "rehydration_live_safe" bootstrap.js
          ! grep -q "auto_lifecycle_safe" bootstrap.js
          ! grep -q "memory_master_safe" bootstrap.js
